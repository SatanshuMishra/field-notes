name: release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'windows/**'
      - 'macos/**'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release.yml'
      - 'tool/release/**'
      - 'third_party/**'
      - 'packages/**'
      - 'shaders/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Read the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
            version="${name}-pr${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version such as 1.2.0 or 1.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build macos --release --build-name ${{ steps.version.outputs.build_name }} --build-number ${{ github.run_number }}

      - name: Build the release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build macos --release

      - name: Pack the disk image
        run: bash tool/release/macos/make_dmg.sh "build/macos/Build/Products/Release/Field Notes.app" "field-notes-${{ steps.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: field-notes-${{ steps.version.outputs.version }}-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Read the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
            version="${name}-pr${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version such as 1.2.0 or 1.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build windows --release --build-name ${{ steps.version.outputs.version }} --build-number ${{ github.run_number }}

      - name: Build the release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build windows --release

      - name: Carry the Visual C++ runtime
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath (Join-Path $release 'field_notes.exe'))) {
            Write-Output "::error::field_notes.exe is missing from $release."
            exit 1
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $source = Join-Path 'C:\Windows\System32' $dll
            if (-not (Test-Path -LiteralPath $source)) {
              Write-Output "::error::$dll is missing from C:\Windows\System32."
              exit 1
            }
            Copy-Item -LiteralPath $source -Destination $release -Force
          }

      - name: Build the installer
        run: iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" "/DOutputBaseName=field-notes-${{ steps.version.outputs.version }}-windows-x64-setup" "/O$env:GITHUB_WORKSPACE\dist" tool\release\windows\field_notes.iss

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Read the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
            version="${name}-pr${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version such as 1.2.0 or 1.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write the release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets to sign the release APK."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf 'storePassword=%s\n' "$(escape "$ANDROID_KEYSTORE_PASSWORD")"
            printf 'keyPassword=%s\n' "$(escape "$ANDROID_KEY_PASSWORD")"
            printf 'keyAlias=%s\n' "$(escape "$ANDROID_KEY_ALIAS")"
            printf 'storeFile=release.jks\n'
          } > android/key.properties

      - name: Build the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --build-name ${{ steps.version.outputs.version }} --build-number ${{ github.run_number }}

      - name: Build the release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "field-notes-${{ steps.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: field-notes-${{ steps.version.outputs.version }}-android.apk
          if-no-files-found: error

  release:
    needs: [macos, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        working-directory: dist
        run: sha256sum "field-notes-$VERSION-macos.dmg" "field-notes-$VERSION-windows-x64-setup.exe" "field-notes-$VERSION-android.apk" > SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Field Notes $VERSION" --notes-file tool/release/release_notes.md "${prerelease[@]}" \
            "dist/field-notes-$VERSION-macos.dmg" \
            "dist/field-notes-$VERSION-windows-x64-setup.exe" \
            "dist/field-notes-$VERSION-android.apk" \
            dist/SHA256SUMS.txt
