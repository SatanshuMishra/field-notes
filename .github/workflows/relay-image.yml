name: relay-image
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'packages/sync_protocol/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Gather the build context
        run: |
          context="$RUNNER_TEMP/relay-context"
          mkdir -p "$context/packages"
          cp -R server "$context/server"
          cp -R packages/sync_protocol "$context/packages/sync_protocol"
          echo "RELAY_CONTEXT=$context" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ env.RELAY_CONTEXT }}
          file: ${{ env.RELAY_CONTEXT }}/server/Dockerfile
          load: true
          tags: field-notes-relay:smoke
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Smoke test
        run: bash server/tool/smoke.sh field-notes-relay:smoke

      - name: Save the image
        run: docker save --output "$RUNNER_TEMP/relay-image.tar" field-notes-relay:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-image
          path: ${{ runner.temp }}/relay-image.tar
          if-no-files-found: error
          retention-days: 1

  push:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/satanshumishra/field-notes-relay
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: relay-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/relay-image.tar"

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        run: |
          revision="sha-${GITHUB_SHA::12}"
          docker tag field-notes-relay:smoke "$IMAGE:main"
          docker tag field-notes-relay:smoke "$IMAGE:$revision"
          docker push "$IMAGE:main"
          docker push "$IMAGE:$revision"

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
