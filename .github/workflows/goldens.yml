name: goldens
on:
  pull_request:
    paths:
      - 'lib/design/**'
      - 'test/design/goldens/**'
      - 'assets/fonts/**'
      - 'pubspec.yaml'
      - '.github/workflows/goldens.yml'
      - 'lib/domain/notes/**'
      - 'lib/features/notes/**'
      - 'lib/features/entry_cards/notes/**'
      - 'lib/features/entry_cards/media/**'
      - 'test/features/notes/support/**'
      - 'lib/data/media/blob_prefix.dart'
      - 'test/design/widgets/widget_harness.dart'
      - 'test/flutter_test_config.dart'

jobs:
  goldens:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Golden tests
        run: flutter test --tags golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/design/goldens/failures/**
